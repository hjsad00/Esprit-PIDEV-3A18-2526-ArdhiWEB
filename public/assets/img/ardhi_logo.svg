<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <style>
      .ardhi-title { font-family: Arial, sans-serif; font-weight: bold; font-size: 52px; fill: #116530; }
      .ardhi-subtitle { font-family: Arial, sans-serif; font-size: 12px; fill: #999999; letter-spacing: 1px; }
    </style>
  </defs>
  
  <!-- Decorative circle background -->
  <circle cx="55" cy="50" r="42" fill="#D4E8E0" opacity="0.8"/>
  
  <!-- Leaf 1 (top-left) -->
  <ellipse cx="35" cy="35" rx="5" ry="8" fill="#28a745" opacity="0.8" transform="rotate(-45 35 35)"/>
  
  <!-- Leaf 2 (bottom-left) -->
  <ellipse cx="40" cy="60" rx="5" ry="8" fill="#28a745" opacity="0.8" transform="rotate(25 40 60)"/>
  
  <!-- Leaf 3 (right) -->
  <ellipse cx="70" cy="50" rx="4" ry="7" fill="#20c997" opacity="0.9" transform="rotate(-30 70 50)"/>
  
  <!-- Main text -->
  <text x="115" y="68" class="ardhi-title">ARDHI</text>
  
  <!-- Subtitle -->
  <text x="115" y="88" class="ardhi-subtitle">Agricultural Intelligence</text>
</svg>
