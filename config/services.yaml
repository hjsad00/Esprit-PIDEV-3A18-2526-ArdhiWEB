# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.mail_from: '%env(string:MAIL_FROM)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $mailFrom: '%app.mail_from%'
            string $projectDir: '%kernel.project_dir%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\EmployeTache\GoogleCalendarService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $calendarId: '%env(GOOGLE_CALENDAR_ID)%'

    App\Service\Evenement\UnsplashImageService:
        arguments:
            $httpClient:  '@http_client'
            $logger:      '@logger'
            $projectDir:  '%kernel.project_dir%'

    App\Service\Evenement\GeminiAIEventService:
        arguments:
            $httpClient:      '@http_client'
            $unsplashService: '@App\Service\Evenement\UnsplashImageService'
            $logger:          '@logger'

    App\Service\Evenement\ParticipationPredictionService: ~

    App\Service\Evenement\QRCodeService:
        arguments:
            $em:                 '@doctrine.orm.entity_manager'
            $participationRepo:  '@App\Repository\Evenement\ParticipationRepository'
            $evenementRepo:      '@App\Repository\Evenement\EvenementRepository'
            $logger:             '@logger'
            $projectDir:         '%kernel.project_dir%'

    App\Service\Evenement\CalendarExportService:
        arguments:
            $logger:       '@logger'
            $projectDir:   '%kernel.project_dir%'
            $requestStack: '@request_stack'

    App\Service\Evenement\SmartEmailRecommendationService:
        arguments:
            $participationRepo: '@App\Repository\Evenement\ParticipationRepository'
            $evenementRepo:     '@App\Repository\Evenement\EvenementRepository'
            $mailer:            '@mailer'
            $logger:            '@logger'
            $mailFrom:          '%env(MAILER_FROM)%'

    App\Service\Evenement\InactiveParticipantDetectionService: ~


